<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1d4f91" />
  <meta name="description" content="Acesso ao sistema da Cooperativa Agropecuária Vale do Rio Doce" />
  <title>Cooperativa Vale do Rio Doce</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/icon.svg" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topo">
    <div class="marca">
      <img src="icons/icon.svg" alt="" width="36" height="36" />
      <div>
        <strong>Cooperativa Vale do Rio Doce</strong>
        <span>Acesso ao sistema</span>
      </div>
    </div>
    <button id="btn-sair" class="btn-ghost" hidden>Sair</button>
  </header>

  <main id="app" class="conteudo">
    <p class="carregando" id="carregando">Carregando...</p>
  </main>

  <template id="tpl-login">
    <section class="cartao">
      <h1>Entrar</h1>
      <form id="form-login" novalidate>
        <label>E-mail
          <input type="email" name="email" autocomplete="email" required />
        </label>
        <label>Senha
          <input type="password" name="senha" autocomplete="current-password" required />
        </label>
        <p class="erro" role="alert" hidden></p>
        <button type="submit" class="btn-primario">Entrar</button>
      </form>
      <p class="rodape-form"><a href="#esqueci" id="ir-esqueci">Esqueci minha senha</a></p>
      <p class="rodape-form">Ainda não tem acesso? <a href="#cadastro" id="ir-cadastro">Fazer cadastro</a></p>
    </section>
  </template>

  <template id="tpl-esqueci">
    <section class="cartao">
      <h1>Recuperar senha</h1>
      <p class="ajuda">Informe o e-mail do seu cadastro. Enviaremos um link para você criar uma nova senha.</p>
      <form id="form-esqueci" novalidate>
        <label>E-mail
          <input type="email" name="email" autocomplete="email" required />
        </label>
        <p class="erro" role="alert" hidden></p>
        <p class="sucesso" role="status" hidden></p>
        <button type="submit" class="btn-primario">Enviar link</button>
      </form>
      <p class="rodape-form"><a href="#entrar">Voltar para entrar</a></p>
    </section>
  </template>

  <template id="tpl-redefinir">
    <section class="cartao">
      <h1>Nova senha</h1>
      <p class="ajuda">Escolha uma senha com pelo menos 8 caracteres.</p>
      <form id="form-redefinir" novalidate>
        <label>Nova senha
          <input type="password" name="senha" autocomplete="new-password" required minlength="8" />
        </label>
        <label>Confirme a nova senha
          <input type="password" name="confirmacao" autocomplete="new-password" required minlength="8" />
        </label>
        <p class="erro" role="alert" hidden></p>
        <button type="submit" class="btn-primario">Salvar nova senha</button>
      </form>
    </section>
  </template>

  <template id="tpl-meus-dados">
    <section class="cartao">
      <h1>Meus dados</h1>
      <p class="ajuda">Você pode alterar seu nome e celular. CPF, e-mail e tipo de acesso são controlados pela cooperativa.</p>
      <form id="form-meus-dados" novalidate>
        <label>Nome completo
          <input type="text" name="nome" autocomplete="name" required minlength="3" />
        </label>
        <label>CPF
          <input type="text" name="cpf" disabled />
        </label>
        <label>E-mail
          <input type="email" name="email" disabled />
        </label>
        <label>Celular
          <input type="tel" name="telefone" inputmode="tel" autocomplete="tel" />
        </label>
        <p class="erro" role="alert" hidden></p>
        <p class="sucesso" role="status" hidden></p>
        <button type="submit" class="btn-primario">Salvar alterações</button>
      </form>

      <h2>Alterar senha</h2>
      <form id="form-alterar-senha" novalidate>
        <label>Senha atual
          <input type="password" name="senha_atual" autocomplete="current-password" required />
        </label>
        <label>Nova senha <small>(mínimo de 8 caracteres)</small>
          <input type="password" name="nova_senha" autocomplete="new-password" required minlength="8" />
        </label>
        <label>Confirme a nova senha
          <input type="password" name="confirmacao" autocomplete="new-password" required minlength="8" />
        </label>
        <p class="erro" role="alert" hidden></p>
        <p class="sucesso" role="status" hidden></p>
        <button type="submit" class="btn-primario">Alterar senha</button>
      </form>

      <h2>Excluir minha conta</h2>
      <p class="ajuda">Esta ação não pode ser desfeita. Escolha o que acontece com o seu histórico de atendimentos e solicitações:</p>
      <p class="ajuda"><strong>Manter de forma anônima:</strong> sua identidade é removida e o registro passa a servir apenas para estatísticas da cooperativa, sem permitir identificar você.</p>
      <p class="ajuda"><strong>Apagar tudo:</strong> seus atendimentos, solicitações e mensagens são removidos do sistema.</p>
      <form id="form-excluir-conta" novalidate>
        <fieldset class="tipos">
          <legend>Histórico</legend>
          <div class="opcoes">
            <label class="opcao">
              <input type="radio" name="modo" value="anonimizar" checked />
              <span>Manter de forma anônima</span>
            </label>
            <label class="opcao">
              <input type="radio" name="modo" value="apagar" />
              <span>Apagar tudo</span>
            </label>
          </div>
        </fieldset>
        <label>Senha atual
          <input type="password" name="senha" autocomplete="current-password" required />
        </label>
        <label>Para confirmar, digite EXCLUIR
          <input type="text" name="confirmacao" autocomplete="off" required />
        </label>
        <p class="erro" role="alert" hidden></p>
        <button type="submit" class="btn-perigo">Excluir minha conta</button>
      </form>

      <h2>Notificações no aparelho</h2>
      <p class="ajuda" id="push-status">Verificando...</p>
      <div class="acoes">
        <button type="button" id="push-botao" class="btn-primario" hidden>Ativar notificações</button>
      </div>

      <h2>Documentos</h2>
      <p class="ajuda">Leia a versão vigente dos documentos que você aceitou.</p>
      <p class="rodape-form"><a href="#termos" target="_blank" rel="noopener">Termos e Condições de Uso</a> · <a href="#privacidade" target="_blank" rel="noopener">Política de Privacidade</a></p>
    </section>
  </template>

  <template id="tpl-cadastro">
    <section class="cartao">
      <h1>Primeiro acesso</h1>
      <p class="ajuda">Escolha o seu tipo de acesso e preencha seus dados. O cadastro passa por aprovação antes de liberar o sistema.</p>
      <form id="form-cadastro" novalidate>
        <fieldset class="tipos">
          <legend>Tipo de acesso</legend>
          <div id="lista-tipos" class="opcoes"></div>
        </fieldset>
        <label>Nome completo
          <input type="text" name="nome" autocomplete="name" required minlength="3" />
        </label>
        <label>CPF
          <input type="text" name="cpf" inputmode="numeric" autocomplete="off" placeholder="000.000.000-00" required />
        </label>
        <label>E-mail
          <input type="email" name="email" autocomplete="email" required />
        </label>
        <label>Senha <small>(mínimo de 8 caracteres)</small>
          <input type="password" name="senha" autocomplete="new-password" required minlength="8" />
        </label>
        <label>Celular
          <input type="tel" name="telefone" inputmode="tel" autocomplete="tel" placeholder="+55(33)999058391" required />
        </label>
        <label class="opcao">
          <input type="checkbox" name="aceite_termos" />
          <span>Li e aceito os <a href="#termos" target="_blank" rel="noopener">Termos e Condições de Uso</a></span>
        </label>
        <label class="opcao">
          <input type="checkbox" name="aceite_privacidade" />
          <span>Li e aceito a <a href="#privacidade" target="_blank" rel="noopener">Política de Privacidade</a></span>
        </label>
        <p class="erro" role="alert" hidden></p>
        <button type="submit" class="btn-primario">Solicitar acesso</button>
      </form>
      <p class="rodape-form">Já tem cadastro? <a href="#entrar">Entrar</a></p>
    </section>
  </template>

  <template id="tpl-pendente">
    <section class="cartao">
      <h1>Cadastro em análise</h1>
      <p>Recebemos o seu cadastro. Assim que um administrador aprovar o acesso, você poderá entrar no sistema.</p>
      <button id="btn-atualizar" class="btn-primario">Verificar novamente</button>
    </section>
  </template>

  <template id="tpl-recusado">
    <section class="cartao">
      <h1>Acesso não liberado</h1>
      <p>Seu cadastro não foi aprovado.</p>
      <p class="motivo" id="motivo-recusa"></p>
    </section>
  </template>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.1/dist/umd/supabase.js" integrity="sha384-K1nraABOP/zFehpLIUksXebbs7jMpB8gYMlb+uhVKZcWT/9Vkq1+qhv6ndC+1Yuz" crossorigin="anonymous"></script>
  <script src="config.js"></script>
  <script src="push.js"></script>
  <script src="interno.js"></script>
  <script src="privacidade.js"></script>
  <script src="atendimento.js"></script>
  <script src="agenda.js"></script>
  <script src="vendor/qrcode.js"></script>
  <script src="carteirinha.js"></script>
  <script src="biblioteca.js"></script>
  <script src="enquetes.js"></script>
  <script src="app.js"></script>
  <script src="registro-sw.js"></script>
</body>
</html>
